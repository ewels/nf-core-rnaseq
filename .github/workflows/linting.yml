# This workflow is managed centrally in nf-core/actions.
# Do not edit — all logic, updates and security fixes arrive automatically via the v1 tag.
name: nf-core linting
on:
  pull_request:
  release:
    types: [published]

permissions: {}

jobs:
  run:
    uses: nf-core/actions/.github/workflows/linting.yml@v1
    permissions:
      contents: read
    secrets: inherit
