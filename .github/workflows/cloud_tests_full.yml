# This workflow is managed centrally in nf-core/actions.
# Do not edit — all logic, updates and security fixes arrive automatically via the v1 tag.
name: full-sized tests on cloud providers
run-name: Submitting workflow to all cloud providers using full sized data
on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to run test"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - aws
          - azure
          - gcp

permissions: {}

jobs:
  run:
    uses: nf-core/actions/.github/workflows/cloud-tests-full.yml@v1
    permissions: {}
    with:
      aligners: "star_salmon,star_rsem"
    secrets: inherit
