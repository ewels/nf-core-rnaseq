# This workflow is managed centrally in nf-core/actions.
# Do not edit — all logic, updates and security fixes arrive automatically via the v1 tag.
name: "Close user-tagged issues and PRs"
on:
  schedule:
    - cron: "0 0 * * 0" # Once a week

permissions: {}

jobs:
  run:
    uses: nf-core/actions/.github/workflows/clean-up.yml@v1
    permissions:
      issues: write
      pull-requests: write
    secrets: inherit
