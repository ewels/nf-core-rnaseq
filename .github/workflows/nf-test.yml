# This workflow is managed centrally in nf-core/actions.
# Do not edit — all logic, updates and security fixes arrive automatically via the v1 tag.
name: Run nf-test
on:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

# Cancel if a newer run is started
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  run:
    uses: nf-core/actions/.github/workflows/nf-test.yml@v1
    permissions:
      contents: read
    secrets: inherit
