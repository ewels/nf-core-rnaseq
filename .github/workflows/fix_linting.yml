# This workflow is managed centrally in nf-core/actions.
# Do not edit — all logic, updates and security fixes arrive automatically via the v1 tag.
name: Fix linting from a comment
on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  run:
    uses: nf-core/actions/.github/workflows/fix-linting.yml@v1
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    secrets: inherit
