# This workflow is managed centrally in nf-core/actions.
# Do not edit — all logic, updates and security fixes arrive automatically via the v1 tag.
name: nf-core branch protection
on:
  pull_request:
    branches:
      - main
      - master

permissions: {}

jobs:
  run:
    uses: nf-core/actions/.github/workflows/branch-protection.yml@v1
    permissions:
      pull-requests: write
    secrets: inherit
