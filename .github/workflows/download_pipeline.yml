# This workflow is managed centrally in nf-core/actions.
# Do not edit — all logic, updates and security fixes arrive automatically via the v1 tag.
name: Test successful pipeline download with 'nf-core pipelines download'
on:
  workflow_dispatch:
    inputs:
      testbranch:
        description: "The specific branch you wish to utilize for the test execution of nf-core pipelines download."
        required: true
        default: "dev"
  pull_request:
    branches:
      - main
      - master

permissions: {}

jobs:
  run:
    uses: nf-core/actions/.github/workflows/download-pipeline.yml@v1
    permissions:
      contents: read
    secrets: inherit
